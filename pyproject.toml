[build-system]
build-backend = "uv_build"
requires      = ["uv-build>=0.12.5,<0.13"]

[project]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ghostscript>=0.8.1",
    "pikepdf>=10.12",
    "pymupdf>=1.28.2",
    "rich>=15",
    "typer>=0.27.1",
]
description = "Compress and optimize PDF files using Ghostscript, pikepdf, and PyMuPDF."
name = "pdf-compress"
readme = "README.md"
requires-python = ">=3.14"
scripts.pdf-compress = "pdf_compress.cli:app"
version = "2.0.0"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.4"]

[tool.ruff]
line-length    = 88
lint.select    = ["B", "E", "F", "I", "UP"]
target-version = "py314"

[tool.pytest]
testpaths = ["tests"]
