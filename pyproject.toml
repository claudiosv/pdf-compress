[project]
name = "pdf-compress"
version = "2.0.0"
description = "Compress and optimize PDF files using Ghostscript, pikepdf, and PyMuPDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pikepdf>=9.0",
    "ghostscript>=0.7",
    "pymupdf>=1.28.2",
]

[project.scripts]
pdf-compress = "pdf_compress.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_compress"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
